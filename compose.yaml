services:
  app:
    build: .
    init: true
    environment:
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?Run npm run setup first}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Run npm run setup first}
      AGENT_MODE: ${AGENT_MODE:-echo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
    ports:
      - "127.0.0.1:3001:3001"
  waha:
    image: devlikeapro/waha:latest-2026.10.1@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    init: true
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Run npm run setup first}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WHATSAPP_HOOK_URL: http://app:3001/webhook
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_CUSTOM_HEADERS: "X-Webhook-Token:${WEBHOOK_TOKEN:?Run npm run setup first}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sessions:/app/.sessions

volumes:
  sessions:
